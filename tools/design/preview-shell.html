<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أضواء الشرق — معاينة تجربة التطبيق</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ece5;color:#34503c;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 28px;background:#fff;border-bottom:1px solid #dce3d5;position:sticky;top:0;z-index:3}h1{font-size:15px;margin:0 0 6px}p{font-size:11px;color:#87927d;margin:0}.tools{display:flex;gap:7px;flex-wrap:wrap}button{border:1px solid #dce4d2;border-radius:10px;background:#f5f8ef;color:#4e6644;padding:10px 13px;font:inherit;cursor:pointer;min-height:40px}button[aria-pressed=true]{background:#244e39;color:#fff;border-color:#244e39}.stage{padding:26px;overflow:auto;min-height:calc(100vh - 90px)}iframe{display:block;margin:auto;border:1px solid #cfd8c7;background:#f5f5f1;border-radius:20px;box-shadow:0 20px 60px #344d3020;max-width:none}.note{text-align:center;padding:0 10px 20px;font-size:11px;color:#839077}@media(max-width:650px){header{padding:14px;display:block}.tools{margin-top:14px}.stage{padding:15px 0}iframe{border-radius:0}.note{font-size:10px}}
iframe{height:calc(100dvh - 110px);border-radius:0}.stage{padding:0;min-height:0}.note{display:none}header{padding:10px 18px}.tools{margin-top:0}@media(max-width:650px){header{padding:10px 12px}.tools{margin-top:8px;gap:5px}button{padding:7px 9px;min-height:36px}iframe{height:calc(100dvh - 140px)}} </style></head><body><header><div><h1>أضواء الشرق <span style="font-weight:400;color:#8c987e">/ تجربة التطبيق</span></h1><p>معاينة التصميم · بيانات تجريبية · الموقع الرسمي لم يتغير</p></div><div class="tools"><button data-size="full" aria-pressed="true">ملء الشاشة</button><button data-size="390" aria-pressed="false">iPhone · 390</button><button data-size="1024" aria-pressed="false">iPad · 1024</button><button id="compare" aria-pressed="false">عرض قبل التصميم</button><button id="reset">إعادة التجربة</button></div></header><main class="stage"><iframe id="preview" title="معاينة إدارة أضواء الشرق" src="design-after.html" width="100%" height="900"></iframe></main><div class="note">جرّب التنقل وإضافة حجز. لا توجد أي قراءة أو كتابة لقاعدة بيانات حقيقية، وتُمسح التجربة عند إعادة التحميل.</div><script>
const frame=document.getElementById('preview');let before=false;
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.width=button.dataset.size==='full'?'100%':button.dataset.size;frame.style.height=button.dataset.size==='full'?'calc(100dvh - 110px)':'';frame.height=button.dataset.size==='390'?'844':'900'});
document.getElementById('compare').onclick=event=>{before=!before;event.currentTarget.setAttribute('aria-pressed',String(before));event.currentTarget.textContent=before?'العودة للتصميم الجديد':'عرض قبل التصميم';frame.src=before?'design-before.html':'design-after.html'};
document.getElementById('reset').onclick=()=>{frame.src=before?'design-before.html':'design-after.html'};
</script></body></html>
