name: Demo Public Check

on:
  push:
    branches:
      - demo/public-trial
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run demo build regression test
        run: node --test tests/demo-public-build.test.mjs
