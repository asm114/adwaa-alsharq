name: First capture preparation (existing folders and read-only source checks)
# No repository-variable approval is changed or bypassed in the older workflows.
# This dedicated setup run is authorized by review of its exact push SHA in the
# existing protected production-backup environment. No capture permission exists.
on:
  push:
    branches: [ops/encrypted-daily-backup-20261024]
    paths:
      - .github/workflows/backup-first-setup.yml
      - tools/backup/prepare_first_capture.py
      - tools/backup/source_diagnostics.py
      - tools/backup/backup.py
permissions:
  contents: read
concurrency:
  group: production-backup-first-setup
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'asm114/adwaa-alsharq' &&
      github.ref == 'refs/heads/ops/encrypted-daily-backup-20261024' &&
      github.event.after == github.sha
    environment: production-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            secret_prefix: CORE
          - target: portal
            secret_prefix: PORTAL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed push commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/first-setup-venv"
          "$RUNNER_TEMP/first-setup-venv/bin/pip" install -r tools/backup/requirements.txt
      - name: Inspect existing folders and diagnose read-only source readiness only
        env:
          BACKUP_TARGET: ${{ matrix.target }}
          BACKUP_CONFIRMED_PROJECT_REF: ${{ vars[format('BACKUP_{0}_CONFIRMED_PROJECT_REF', matrix.secret_prefix)] }}
          BACKUP_STORAGE_API_KEY: ${{ secrets[format('BACKUP_{0}_STORAGE_API_KEY', matrix.secret_prefix)] }}
          PGHOST: ${{ secrets[format('BACKUP_{0}_PGHOST', matrix.secret_prefix)] }}
          PGPORT: '5432'
          PGUSER: ${{ secrets[format('BACKUP_{0}_PGUSER', matrix.secret_prefix)] }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets[format('BACKUP_{0}_PGPASSWORD', matrix.secret_prefix)] }}
          PGSSLMODE: verify-full
          BACKUP_CA_PEM: ${{ secrets[format('BACKUP_{0}_CA_PEM', matrix.secret_prefix)] }}
          BACKUP_STORAGE_PROVIDER: drive
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_ACCOUNT: ${{ vars.BACKUP_DRIVE_ACCOUNT }}
          BACKUP_DRIVE_ESTIMATED_DAILY_BYTES: ${{ vars[format('BACKUP_{0}_DRIVE_ESTIMATED_DAILY_BYTES', matrix.secret_prefix)] }}
          BACKUP_DRIVE_SETUP_APPROVED: ${{ vars.BACKUP_DRIVE_SETUP_APPROVED }}
          BACKUP_DRIVE_RETENTION_APPROVED: 'false'
          BACKUP_PRODUCTION_RESTORE_VERIFIED: 'false'
          BACKUP_SCHEDULE_APPROVED: 'false'
          BACKUP_MAX_STORAGE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_STORAGE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_MAX_DATABASE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_DATABASE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_RESTORE_IMAGE: ${{ vars[format('BACKUP_{0}_RESTORE_IMAGE', matrix.secret_prefix)] }}
          BACKUP_EXECUTION_APPROVED: 'false'
          BACKUP_RESTORE_APPROVED: 'false'
          BACKUP_COST_APPROVED: ${{ vars.BACKUP_COST_APPROVED }}
        run: |
          set -euo pipefail
          umask 077
          export PGSSLROOTCERT="$RUNNER_TEMP/adwaa-postgres-ca.pem"
          trap 'rm -f "$PGSSLROOTCERT"' EXIT
          printf '%s' "$BACKUP_CA_PEM" > "$PGSSLROOTCERT"
          "$RUNNER_TEMP/first-setup-venv/bin/python" tools/backup/prepare_first_capture.py
