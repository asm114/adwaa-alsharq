name: Protected full backup retry and isolated restore
# Reviewer approval is bound to this exact push SHA. Fixed operation only.
# No schedule, retention, folder creation, merge or deployment.
# Retry prerequisite: run 40346048497 at 8c8d577 validated both keys and
# authenticated the three OLD Portal parts, which remain incomplete and untouched.
# This run exports NEW snapshots with new UUIDs and never resumes that old group.
on:
  push:
    branches: [ops/encrypted-daily-backup-20261024]
    paths:
      - .github/workflows/backup-first-capture.yml
      - tools/backup/first_capture.py
permissions:
  contents: read
concurrency:
  group: production-backup-first-capture
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'asm114/adwaa-alsharq' &&
      github.ref == 'refs/heads/ops/encrypted-daily-backup-20261024' &&
      github.event.after == github.sha
    environment: production-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            secret_prefix: CORE
          - target: portal
            secret_prefix: PORTAL
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed push commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/first-capture-venv"
          "$RUNNER_TEMP/first-capture-venv/bin/pip" install -r tools/backup/requirements.txt
      - name: Build immutable restore image with required extension versions
        run: |
          set -euo pipefail
          docker build -f tools/backup/restore-image.Dockerfile -t adwaa-first-restore:tested tools/backup
          image=$(docker image inspect adwaa-first-restore:tested --format '{{.Id}}')
          test "${#image}" -eq 71
          echo "BACKUP_RESTORE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "BACKUP_TEST_RESTORE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Test encryption and restore using synthetic data before source access
        env:
          BACKUP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/first-capture-venv/bin/python" -m unittest discover -s tests/backup -p 'test_*.py'
          "$RUNNER_TEMP/first-capture-venv/bin/python" tests/backup/restore_integration.py
      - name: First encrypted capture and independent isolated restore only
        env:
          BACKUP_TARGET: ${{ matrix.target }}
          BACKUP_CONFIRMED_PROJECT_REF: ${{ vars[format('BACKUP_{0}_CONFIRMED_PROJECT_REF', matrix.secret_prefix)] }}
          BACKUP_STORAGE_API_KEY: ${{ secrets[format('BACKUP_{0}_STORAGE_API_KEY', matrix.secret_prefix)] }}
          PGHOST: ${{ secrets[format('BACKUP_{0}_PGHOST', matrix.secret_prefix)] }}
          PGPORT: '5432'
          PGUSER: ${{ secrets[format('BACKUP_{0}_PGUSER', matrix.secret_prefix)] }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets[format('BACKUP_{0}_PGPASSWORD', matrix.secret_prefix)] }}
          PGSSLMODE: verify-full
          BACKUP_CA_PEM: ${{ secrets[format('BACKUP_{0}_CA_PEM', matrix.secret_prefix)] }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets[format('BACKUP_{0}_ENCRYPTION_KEY', matrix.secret_prefix)] }}
          BACKUP_STORAGE_PROVIDER: drive
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_ACCOUNT: ${{ vars.BACKUP_DRIVE_ACCOUNT }}
          BACKUP_DRIVE_SETUP_APPROVED: ${{ vars.BACKUP_DRIVE_SETUP_APPROVED }}
          BACKUP_DRIVE_RETENTION_APPROVED: 'false'
          BACKUP_PRODUCTION_RESTORE_VERIFIED: 'false'
          BACKUP_SCHEDULE_APPROVED: 'false'
          BACKUP_MAX_STORAGE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_STORAGE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_MAX_DATABASE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_DATABASE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_EXECUTION_APPROVED: 'true'
          BACKUP_RESTORE_APPROVED: 'true'
          BACKUP_COST_APPROVED: ${{ vars.BACKUP_COST_APPROVED }}
        run: |
          set -euo pipefail
          umask 077
          export PGSSLROOTCERT="$RUNNER_TEMP/adwaa-postgres-ca.pem"
          trap 'rm -f "$PGSSLROOTCERT"' EXIT
          printf '%s' "$BACKUP_CA_PEM" > "$PGSSLROOTCERT"
          "$RUNNER_TEMP/first-capture-venv/bin/python" tools/backup/first_capture.py
      - name: Remove only isolated export and restore containers
        if: always()
        run: |
          for kind in source export restore; do
            docker ps -aq --filter "name=adwaa-backup-$kind-" | xargs -r docker rm -f
          done
