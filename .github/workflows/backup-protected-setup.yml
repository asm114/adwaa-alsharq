name: Protected backup setup (no production backup)
# BACKUP_SETUP_MODE and BACKUP_SETUP_APPROVED_SHA are REPOSITORY variables:
# environment variables are unavailable while job-level if is evaluated.
# Missing controls skip all jobs. Environment review still gates every target.
on:
  push:
    branches: [ops/encrypted-daily-backup-20261024]
permissions:
  contents: read
concurrency:
  group: production-backup-setup
  cancel-in-progress: false
jobs:
  initialize-drive:
    if: >-
      github.repository == 'asm114/adwaa-alsharq' &&
      github.ref == 'refs/heads/ops/encrypted-daily-backup-20261024' &&
      vars.BACKUP_SETUP_MODE == 'init-drive' &&
      vars.BACKUP_SETUP_APPROVED_SHA == github.sha
    environment: production-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            secret_prefix: CORE
          - target: portal
            secret_prefix: PORTAL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-setup-venv"
          "$RUNNER_TEMP/backup-setup-venv/bin/pip" install -r tools/backup/requirements.txt
      - name: Initialize only the project-marked folder; never export data
        env:
          BACKUP_TARGET: ${{ matrix.target }}
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_ACCOUNT: ${{ vars.BACKUP_DRIVE_ACCOUNT }}
          BACKUP_EXECUTION_APPROVED: ${{ vars.BACKUP_EXECUTION_APPROVED }}
          BACKUP_COST_APPROVED: ${{ vars.BACKUP_COST_APPROVED }}
          BACKUP_DRIVE_SETUP_APPROVED: ${{ vars.BACKUP_DRIVE_SETUP_APPROVED }}
          BACKUP_DRIVE_RETENTION_APPROVED: 'false'
          BACKUP_SCHEDULE_APPROVED: 'false'
          BACKUP_PRODUCTION_RESTORE_VERIFIED: 'false'
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/backup-setup-venv/bin/python" tools/backup/backup.py init-drive
  read-only-preflight:
    if: >-
      github.repository == 'asm114/adwaa-alsharq' &&
      github.ref == 'refs/heads/ops/encrypted-daily-backup-20261024' &&
      vars.BACKUP_SETUP_MODE == 'preflight' &&
      vars.BACKUP_SETUP_APPROVED_SHA == github.sha
    environment: production-backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            secret_prefix: CORE
          - target: portal
            secret_prefix: PORTAL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-setup-venv"
          "$RUNNER_TEMP/backup-setup-venv/bin/pip" install -r tools/backup/requirements.txt
      - name: Read-only connection and inventory checks; no dump or upload
        env:
          BACKUP_TARGET: ${{ matrix.target }}
          BACKUP_CONFIRMED_PROJECT_REF: ${{ vars[format('BACKUP_{0}_CONFIRMED_PROJECT_REF', matrix.secret_prefix)] }}
          BACKUP_STORAGE_API_KEY: ${{ secrets[format('BACKUP_{0}_STORAGE_API_KEY', matrix.secret_prefix)] }}
          PGHOST: ${{ secrets[format('BACKUP_{0}_PGHOST', matrix.secret_prefix)] }}
          PGPORT: '5432'
          PGUSER: ${{ secrets[format('BACKUP_{0}_PGUSER', matrix.secret_prefix)] }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets[format('BACKUP_{0}_PGPASSWORD', matrix.secret_prefix)] }}
          PGSSLMODE: verify-full
          BACKUP_CA_PEM: ${{ secrets[format('BACKUP_{0}_CA_PEM', matrix.secret_prefix)] }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets[format('BACKUP_{0}_ENCRYPTION_KEY', matrix.secret_prefix)] }}
          BACKUP_STORAGE_PROVIDER: drive
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.BACKUP_DRIVE_REFRESH_TOKEN }}
          BACKUP_DRIVE_ACCOUNT: ${{ vars.BACKUP_DRIVE_ACCOUNT }}
          BACKUP_DRIVE_FOLDER_ID: ${{ vars[format('BACKUP_{0}_DRIVE_FOLDER_ID', matrix.secret_prefix)] }}
          BACKUP_DRIVE_ESTIMATED_DAILY_BYTES: ${{ vars[format('BACKUP_{0}_DRIVE_ESTIMATED_DAILY_BYTES', matrix.secret_prefix)] }}
          BACKUP_DRIVE_SETUP_APPROVED: ${{ vars.BACKUP_DRIVE_SETUP_APPROVED }}
          BACKUP_DRIVE_RETENTION_APPROVED: 'false'
          BACKUP_PRODUCTION_RESTORE_VERIFIED: 'false'
          BACKUP_SCHEDULE_APPROVED: 'false'
          BACKUP_MAX_STORAGE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_STORAGE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_MAX_DATABASE_BYTES: ${{ vars[format('BACKUP_{0}_MAX_DATABASE_BYTES', matrix.secret_prefix)] || '1073741824' }}
          BACKUP_RESTORE_IMAGE: ${{ vars[format('BACKUP_{0}_RESTORE_IMAGE', matrix.secret_prefix)] }}
          BACKUP_EXECUTION_APPROVED: ${{ vars.BACKUP_EXECUTION_APPROVED }}
          BACKUP_RESTORE_APPROVED: ${{ vars.BACKUP_RESTORE_APPROVED }}
          BACKUP_COST_APPROVED: ${{ vars.BACKUP_COST_APPROVED }}
        run: |
          set -euo pipefail
          umask 077
          export PGSSLROOTCERT="$RUNNER_TEMP/adwaa-preflight-ca.pem"
          trap 'rm -f "$PGSSLROOTCERT"' EXIT
          printf '%s' "$BACKUP_CA_PEM" > "$PGSSLROOTCERT"
          "$RUNNER_TEMP/backup-setup-venv/bin/python" tools/backup/backup.py preflight
